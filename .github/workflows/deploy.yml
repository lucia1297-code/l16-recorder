name: Build and Deploy to Surge

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l16-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://l16-academy.surge.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Test deployment verification
        run: node --test scripts/deployment.test.mjs
      - run: npm ci
      - name: Build fresh application
        run: |
          node -e 'for (const key of ["VITE_SUPABASE_URL", "VITE_SUPABASE_ANON_KEY", "VITE_ADMIN_ACCESS_CODE", "VITE_ADMIN_PASSWORD"]) { if (!process.env[key]) throw new Error("Missing required secret: " + key); }'
          npx vite build
          node -e 'require("fs").writeFileSync("dist/version.json", JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID})); require("fs").copyFileSync("dist/index.html", "dist/200.html")'
        env:
          VITE_ADMIN_ACCESS_CODE: ${{ secrets.VITE_ADMIN_ACCESS_CODE }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_ADMIN_PHONE: ${{ secrets.VITE_ADMIN_PHONE }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Provider credentials must stay in server-side functions, never VITE_*.
      - name: Deploy to Surge
        timeout-minutes: 3
        run: |
          test -n "$SURGE_TOKEN" || { echo 'Missing SURGE_TOKEN'; exit 1; }
          npx --yes surge@0.24.6 dist l16-academy.surge.sh < /dev/null
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          SURGE_LOGIN: lucia1297@gmail.com
      - name: Verify deployed version and all files
        timeout-minutes: 5
        run: node scripts/verify-deployment.mjs https://l16-academy.surge.sh dist
