name: Build and Deploy to Surge

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx vite build
        env:
          VITE_ADMIN_ACCESS_CODE: ${{ secrets.VITE_ADMIN_ACCESS_CODE }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_ADMIN_PHONE: ${{ secrets.VITE_ADMIN_PHONE }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SOLAPI_API_KEY: ${{ secrets.VITE_SOLAPI_API_KEY }}
          VITE_SOLAPI_API_SECRET: ${{ secrets.VITE_SOLAPI_API_SECRET }}
          VITE_SOLAPI_SENDER: ${{ secrets.VITE_SOLAPI_SENDER }}
          VITE_NEON_DATABASE_URL: ${{ secrets.VITE_NEON_DATABASE_URL }}
          VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY }}

      - name: Deploy to Surge
        run: |
          npm install -g surge
          surge dist l16-academy.surge.sh --token $SURGE_TOKEN
          sleep 5
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://l16-academy.surge.sh/)
          echo "Surge HTTP status: $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "ERROR: 배포 실패 HTTP $HTTP"
            exit 1
          fi
          echo "SUCCESS: 배포 완료"
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
